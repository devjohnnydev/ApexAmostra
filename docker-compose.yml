version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: apextech_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: apex_local_password
      MYSQL_DATABASE: apextech
      MYSQL_USER: apextech_user
      MYSQL_PASSWORD: apextech_password
    ports:
      - "3306:3306"
    volumes:
      - apextech_mysqldata:/var/lib/mysql

  api:
    build: 
      context: .
      dockerfile: Dockerfile.local
    container_name: apextech_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=apextech_user
      - DB_PASSWORD=apextech_password
      - DB_NAME=apextech
      - DB_PORT=3306
      - JWT_SECRET=apextech_secret_key_2026_safe
      - NODE_ENV=production
    depends_on:
      - db
    volumes:
      - ./logs:/usr/src/app/logs

volumes:
  apextech_mysqldata:
